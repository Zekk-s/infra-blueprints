name: Bug report
description: Report a defect or regression in a Terraform module
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: module
    attributes:
      label: Affected module
      description: "modules/cloudflare-worker, modules/oracle-compute, modules/supabase-edge"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
