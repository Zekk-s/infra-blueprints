name: Feature request
description: Propose a new module, output, or input variable
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternatives considered
    validations:
      required: false
